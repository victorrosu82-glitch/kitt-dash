<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>KITT Dash - machete ecran 2 (viteza) si ecran 3 (energie), Lexus 1280x480</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
svg{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<!--
  ?ecran=2              viteza mare
  ?ecran=3&stare=accel  energie: accelerare, motorul si bateria imping amandoua
  ?ecran=3&stare=regen  energie: franare, rotile incarca bateria
  ?ecran=3&stare=ev     energie: numai pe baterie
-->
<svg id="k" viewBox="0 0 1280 480" preserveAspectRatio="xMidYMid meet"></svg>
<script>
const P=new URLSearchParams(location.search),ECRAN=P.get('ecran')||'2',STARE=P.get('stare')||'accel';
const S=document.getElementById('k'),NS='http://www.w3.org/2000/svg',F='Roboto, Arial, Helvetica, sans-serif';
const DIM='#2b0c0a',RED='#ff2d1c',ORG='#ff7a1a',AMB='#ffb21c',CY='#35d0ff',LAB='#9a2f26',VAL='#ff5a2a',LINE='#3a0f0c',RS='#8a2a22';
function mk(t,a,txt,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined&&txt!==null)e.textContent=txt;(p||S).appendChild(e);return e}

// --- bara Android Auto (stanga) -------------------------------------------
mk('rect',{x:0,y:0,width:1280,height:480,fill:'#000'});
mk('text',{x:40,y:74,'font-size':22,fill:'#fff','font-family':F,'text-anchor':'middle','font-weight':500},'14:41');
[[163,'#e8e8e8'],[231,'#1ed760'],[299,'#25d366']].forEach(([y,c])=>{mk('rect',{x:14,y:y-26,width:52,height:52,rx:14,fill:'#2a2a2a'});mk('circle',{cx:40,cy:y,r:18,fill:c,opacity:0.9})});
mk('rect',{x:30,y:350,width:20,height:30,rx:10,fill:'none',stroke:'#fff','stroke-width':3});
mk('rect',{x:26,y:420,width:28,height:28,rx:3,fill:'none',stroke:'#fff','stroke-width':3});

// --- panza KITT 1190x460 ------------------------------------------------
const G=mk('g',{transform:'translate(80,10)'});
mk('rect',{x:0,y:0,width:1190,height:460,rx:18,fill:'#050505'},null,G);
function t(x,y,s,fill,txt,anc,ls,w,extra){return mk('text',Object.assign({x:x,y:y,'font-size':s,fill:fill,'font-family':F,'text-anchor':anc||'start','letter-spacing':ls||0,'font-weight':w||400},extra||{}),txt,G)}
function r(x,y,w,h,fill,extra){return mk('rect',Object.assign({x:x,y:y,width:w,height:h,fill:fill},extra||{}),null,G)}
function ln(x1,y1,x2,y2,c,w,extra){return mk('line',Object.assign({x1,y1,x2,y2,stroke:c,'stroke-width':w},extra||{}),null,G)}

// Antet si scaner, la fel pe toate ecranele: semnul lui KITT ramane
function antet(mod,culMod,titlu){
 t(40,32,17,'#ff3b2a','LEXUS NX 300h','start',4);
 t(595,32,13,RS,titlu,'middle',6);
 t(1150,32,17,culMod,mod,'end',4);
 ln(40,42,1150,42,LINE,1.5);
 const N=34,SX=200,SW=790,pas=SW/N,pos=21;
 for(let i=0;i<N;i++){const d=i-pos,ad=Math.abs(d),op=d>0?Math.max(0,1-ad/2.5):Math.max(0,1-ad/7);
  if(op>0.08)r(SX+i*pas-3,49,pas+3,34,RED,{opacity:(op*0.28).toFixed(2)});
  r(SX+i*pas,52,pas-4,28,op>0.08?RED:DIM,{opacity:op>0.08?Math.max(0.12,op).toFixed(2):1})}
}
// Puncte care arata pe ce ecran esti: 1 bordul, 2 viteza, 3 energie
function puncte(activ){const n=activ>3?5:3;for(let i=1;i<=n;i++)mk('circle',{cx:595+(i-(n+1)/2)*18,cy:447,r:4,fill:i===activ?RED:DIM},null,G)}

// =======================================================================
if(ECRAN==='2'){
 antet('HYBRID',AMB,'VITEZA');
 const viteza=87;
 // Cifrele mari, cu halou
 t(595,318,250,RED,viteza,'middle',-6,500,{opacity:0.18,'stroke':RED,'stroke-width':14});
 t(595,318,250,'#ff3b2a',viteza,'middle',-6,500);
 t(595,352,20,RS,'KM/H','middle',8);
 // Rigla de viteza pe toata latimea, 0-180
 const N=60,X0=95,X1=1095,pas=(X1-X0)/N,aprinse=Math.round(viteza/180*N);
 for(let i=0;i<N;i++){const c=i<aprinse?(i===aprinse-1?'#ffd6cc':(i>N*0.75?ORG:RED)):DIM;r(X0+i*pas,374,pas-4,14,c)}
 [0,30,60,90,120,150,180].forEach(v=>t(X0+v/180*(X1-X0),408,13,RS,v,'middle'));
 // Stanga: bateria; dreapta: puterea
 t(40,120,13,LAB,'HV BATTERY','start',2);
 const bat=[];for(let i=0;i<10;i++)r(40,130+(9-i)*15,48,11,i<6?(i<2?RED:AMB):DIM);
 t(100,262,38,AMB,'61%','start',0,500);
 t(1150,120,13,LAB,'POWER','end',2);
 for(let j=0;j<5;j++)r(1102,130+(4-j)*15,48,11,j<3?(j>1?ORG:AMB):DIM);
 for(let j=0;j<5;j++)r(1102,215+j*15,48,11,DIM);
 t(1090,262,38,AMB,'+14','end',0,500);t(1150,262,14,LAB,'kW','end',1);
 // Manevra urmatoare, o singura linie, numai cat merge navigatia
 mk('path',{d:'M400 438 L400 426 Q400 418 408 418 L420 418',fill:'none',stroke:AMB,'stroke-width':5,'stroke-linecap':'round'},null,G);
 mk('path',{d:'M418 411 L428 418 L418 425 Z',fill:AMB},null,G);
 t(442,437,22,'#ff3b2a','300 m','start',0,500);
 t(520,437,16,VAL,'CALEA BUCURESTI','start',2);
 puncte(2);
}

// =======================================================================
if(ECRAN==='3'){
 // NX 300h E-Four, hibrid serie-paralel:
 //  - fata: motorul termic si transmisia hibrida cu doua masini electrice
 //    (generatorul MG1 si motorul MG2), legate prin angrenajul planetar;
 //    motorul termic poate trage rotile si, in acelasi timp, incarca bateria;
 //  - spate: al treilea motor electric (MGR), numai pe rotile din spate;
 //  - bateria HV sub bancheta din spate.
 const st={
  accel:{mod:'HYBRID',cm:AMB,motor:true,inBat:false,fata:true,spate:true,kw:'+18',a:'+74',v:'243',soc:58,viteza:'74',rpm:'2100',
         txt:'MOTORUL SI BATERIA TRAG PE TOATE ROTILE'},
  ev:{mod:'EV',cm:CY,motor:false,inBat:false,fata:true,spate:false,kw:'+9',a:'+37',v:'246',soc:61,viteza:'28',rpm:'0',
         txt:'NUMAI PE BATERIE'},
  incarca:{mod:'HYBRID',cm:AMB,motor:true,inBat:true,gen:true,fata:false,spate:false,kw:'-6',a:'-24',v:'252',soc:47,viteza:'62',rpm:'1600',
         txt:'MOTORUL TRAGE SI INCARCA BATERIA'},
  regen:{mod:'REGEN',cm:CY,motor:false,inBat:true,fata:true,spate:true,kw:'-21',a:'-81',v:'259',soc:63,viteza:'46',rpm:'0',
         txt:'FRANAREA INCARCA BATERIA'},
 }[STARE];
 antet(st.mod,st.cm,'ENERGIE');

 // Masina vazuta de sus, fata in stanga. Contur de sarma, ca la KITT.
 const X0=70,X1=740,Y0=118,Y1=402,YM=(Y0+Y1)/2;
 mk('path',{d:`M${X0+60} ${Y0} L${X1-40} ${Y0} Q${X1} ${Y0} ${X1} ${Y0+40} L${X1} ${Y1-40} Q${X1} ${Y1} ${X1-40} ${Y1} L${X0+60} ${Y1} Q${X0} ${Y1} ${X0} ${Y1-60} L${X0} ${Y0+60} Q${X0} ${Y0} ${X0+60} ${Y0} Z`,
  fill:'#070202',stroke:LINE,'stroke-width':2},null,G);
 ln(330,Y0+14,330,Y1-14,'#2a0b09',1.5);ln(680,Y0+14,680,Y1-14,'#2a0b09',1.5);
 const FA=190,SA=610;
 function roata(x,y,aprins,c){r(x-34,y-14,68,28,aprins?c:'#120403',{rx:6,stroke:aprins?c:LINE,'stroke-width':2,opacity:aprins?0.9:1})}
 function flux(pts,c,activ){
  const d='M'+pts.map(p=>p.join(' ')).join(' L');
  mk('path',{d,fill:'none',stroke:activ?c:'#1c0806','stroke-width':activ?3:2,opacity:activ?0.3:1},null,G);
  if(!activ)return;
  for(let k=0;k<pts.length-1;k++){const [ax,ay]=pts[k],[bx,by]=pts[k+1],L=Math.hypot(bx-ax,by-ay),ux=(bx-ax)/L,uy=(by-ay)/L,n=Math.max(2,Math.round(L/24)),pas=L/n;
   for(let i=1;i<n;i++){const x=ax+ux*i*pas,y=ay+uy*i*pas,px=-uy,py=ux,op=0.35+0.65*(((i+k)%4)/3);
    mk('path',{d:`M${x-ux*6+px*7} ${y-uy*6+py*7} L${x+ux*5} ${y+uy*5} L${x-ux*6-px*7} ${y-uy*6-py*7}`,fill:'none',stroke:c,'stroke-width':3.5,'stroke-linecap':'round','stroke-linejoin':'round',opacity:op.toFixed(2)},null,G)}}
 }
 function rev(p){return p.slice().reverse()}
 function caseta(x,y,w,h,titlu,aprins,c,sub){
  r(x-w/2,y-h/2,w,h,'#0a0302',{rx:5,stroke:aprins?c:LINE,'stroke-width':aprins?2.5:1.5});
  t(x,y-h/2-8,11,aprins?c:LAB,titlu,'middle',3);
  if(sub)t(x,y+7,18,aprins?c:DIM,sub,'middle',0,500);
 }
 const ENG=[120,YM],TR=[250,YM],BAT=[470,YM],MGR=[SA,YM];
 const motorLaTr=[[ENG[0]+40,YM],[TR[0]-48,YM]];
 const trLaFata=[[TR[0]-20,YM-38],[TR[0]-20,YM-70],[FA,YM-70],[FA,Y0+40]];
 const trLaFata2=[[TR[0]-20,YM+38],[TR[0]-20,YM+70],[FA,YM+70],[FA,Y1-40]];
 const batLaTr=[[BAT[0]-58,YM],[TR[0]+48,YM]];
 const batLaSpate=[[BAT[0]+58,YM],[MGR[0]-28,YM]];
 const mgrSus=[[MGR[0],YM-30],[MGR[0],Y0+40]],mgrJos=[[MGR[0],YM+30],[MGR[0],Y1-40]];

 const fataActiva=st.motor||st.fata;
 const regen=st.inBat&&!st.motor;
 const cRotiFata=regen?CY:(st.motor?AMB:CY);
 flux(motorLaTr,AMB,st.motor);
 flux(regen?rev(trLaFata):trLaFata,cRotiFata,fataActiva);
 flux(regen?rev(trLaFata2):trLaFata2,cRotiFata,fataActiva);
 const batTrActiv=st.fata||st.gen;
 flux(st.inBat?rev(batLaTr):batLaTr,st.gen?AMB:CY,batTrActiv);
 flux(st.inBat?rev(batLaSpate):batLaSpate,CY,st.spate);
 flux(st.inBat?rev(mgrSus):mgrSus,CY,st.spate);flux(st.inBat?rev(mgrJos):mgrJos,CY,st.spate);

 roata(FA,Y0+22,fataActiva,cRotiFata);roata(FA,Y1-22,fataActiva,cRotiFata);
 roata(SA,Y0+22,st.spate,CY);roata(SA,Y1-22,st.spate,CY);
 caseta(ENG[0],ENG[1],80,64,'MOTOR',st.motor,AMB,st.rpm);
 t(ENG[0],ENG[1]+24,9,st.motor?'#b8861c':DIM,'RPM','middle',2);
 caseta(TR[0],TR[1],96,76,'',fataActiva||st.gen,st.motor?AMB:CY);t(TR[0],TR[1]+31,9,(fataActiva||st.gen)?(st.motor?AMB:CY):LAB,'MG1 · MG2','middle',2);
 const cG=st.gen?AMB:(st.motor?AMB:DIM),cM=st.fata?CY:DIM;
 mk('circle',{cx:TR[0]-20,cy:TR[1]-6,r:16,fill:'none',stroke:cG,'stroke-width':2},null,G);
 mk('circle',{cx:TR[0]+20,cy:TR[1]-6,r:16,fill:'none',stroke:cM,'stroke-width':2},null,G);
 t(TR[0]-20,TR[1]-2,10,cG===DIM?LAB:cG,'G','middle',0,500);t(TR[0]+20,TR[1]-2,10,cM===DIM?LAB:cM,'M','middle',0,500);
 caseta(BAT[0],BAT[1],116,64,'BATERIE HV',true,CY);
 for(let i=0;i<10;i++)r(BAT[0]-50+i*10.2,BAT[1]-18,7.5,20,i<st.soc/10?(i<2?RED:CY):DIM);
 t(BAT[0],BAT[1]+22,13,CY,st.soc+'%','middle',1,500);
 caseta(MGR[0],MGR[1],56,60,'MGR',st.spate,CY);
 t(MGR[0],MGR[1]+5,13,st.spate?CY:DIM,'M','middle',0,500);
 t(X0+6,Y0-6,11,LAB,'FATA','start',3);t(X1-6,Y0-6,11,LAB,'SPATE','end',3);

 const CX=800;ln(CX-20,96,CX-20,420,LINE,1.5);
 t(CX,112,13,LAB,'PUTERE BATERIE','start',2);
 t(CX,160,52,st.kw[0]==='-'?CY:AMB,st.kw,'start',0,500);t(CX+st.kw.length*29+6,160,18,LAB,'kW','start',2);
 const BX=CX,BW=350,mij=BX+BW/2,val=parseFloat(st.kw);
 for(let i=0;i<14;i++){const x=BX+i*(BW/14),cs=x+BW/28,aprins=val>0?(cs>mij&&cs<mij+val/30*BW/2):(cs<mij&&cs>mij+val/30*BW/2);
  r(x,178,BW/14-4,14,aprins?(val>0?AMB:CY):DIM)}
 t(BX,210,11,LAB,'INCARCA','start',2);t(BX+BW,210,11,LAB,'CONSUMA','end',2);
 t(CX,256,13,LAB,'TENSIUNE','start',2);t(CX,290,30,VAL,st.v+' V');
 t(CX+190,256,13,LAB,'CURENT','start',2);t(CX+190,290,30,VAL,st.a+' A');
 t(CX,334,13,LAB,'VITEZA','start',2);t(CX,368,30,VAL,st.viteza+' km/h');
 t(CX+190,334,13,LAB,'MOTOR','start',2);t(CX+190,368,30,VAL,'88°C');
 puncte(3);
}

// =======================================================================
// ECRAN 4 - MODULATORUL: tot ecranul e cutia vocii lui KITT. Trei coloane
// de bare: stanga = viteza, mijloc = puterea, dreapta = bateria. Cifrele
// stau mici, sub ele; ochiul citeste inaltimea, nu numarul.
if(ECRAN==='4'){
 antet('EV',CY,'MODULATOR');
 const col=[{x:300,v:0.48,txt:'52',u:'KM/H',c:RED},{x:595,v:0.72,txt:'+11',u:'KW',c:AMB},{x:890,v:0.61,txt:'61%',u:'HV',c:CY}];
 const W=190,N=15,Y0=100,Y1=388,h=(Y1-Y0)/N;
 col.forEach((k,ci)=>{
  // ca la KITT: coloana din mijloc creste din centru, cele laterale din centru dar mai scurte
  const mij=(Y0+Y1)/2,aprinse=Math.round(k.v*N);
  for(let i=0;i<N;i++){
   const d=Math.abs(i-(N-1)/2),lit=d<=aprinse/2;
   const w=ci===1?W:W*0.78;
   r(k.x-w/2,Y0+i*h+2,w,h-5,lit?k.c:DIM,{opacity:lit?(1-d/(N/2)*0.55).toFixed(2):1,rx:2});
   if(lit&&d<1)r(k.x-w/2-6,Y0+i*h-2,w+12,h+3,k.c,{opacity:0.15,rx:3});
  }
  t(k.x,418,22,k.c,k.txt,'middle',2,500);t(k.x,436,11,LAB,k.u,'middle',4);
 });
 // ramele cutiei de voce, ca in serial
 [[300,0.78],[595,1],[890,0.78]].forEach(([x,f])=>{const w=W*f+24;r(x-w/2,92,w,304,'none',{stroke:LINE,'stroke-width':1.5,rx:6})});
}

// =======================================================================
// ECRAN 5 - DRUMUL: o sosea in perspectiva, ca in anii '80. Liniile vin spre
// tine cu viteza masinii; orizontul isi schimba culoarea dupa mod (albastru
// pe baterie, ambra cu motorul, rosu la frana). Viteza e singura cifra.
if(ECRAN==='5'){
 antet('HYBRID',AMB,'DRUM');
 const HX=595,HY=170,Yb=450,cul=AMB;
 // soarele/orizontul
 const def=mk('defs',{},null,G);
 const lg=mk('linearGradient',{id:'cer',x1:0,y1:0,x2:0,y2:1},null,def);
 mk('stop',{offset:'0',['stop-color']:'#050505'},null,lg);mk('stop',{offset:'1',['stop-color']:cul,['stop-opacity']:'0.35'},null,lg);
 r(20,96,1150,HY-96,'url(#cer)');
 for(let i=0;i<7;i++){const y=HY-12-i*9,w=180-i*18;r(HX-w/2,y,w,5-i*0.5,cul,{opacity:(0.9-i*0.11).toFixed(2)})}
 ln(20,HY,1170,HY,cul,2);
 // liniile care fug spre orizont
 const cp=mk('clipPath',{id:'taie'},null,def);mk('rect',{x:20,y:HY,width:1150,height:Yb-HY},null,cp);
 const C=mk('g',{'clip-path':'url(#taie)'},null,G);
 for(let k=-9;k<=9;k++){mk('line',{x1:HX+k*14,y1:HY,x2:HX+k*150,y2:Yb,stroke:RED,'stroke-width':1.5,opacity:(1-Math.abs(k)/11).toFixed(2)},null,C)}
 // liniile orizontale, tot mai dese spre orizont
 for(let i=1;i<=9;i++){const f=Math.pow(i/9,2.2),y=HY+(Yb-HY)*f;ln(20,y,1170,y,RED,1+f*2,{opacity:(0.2+f*0.8).toFixed(2)})}
 // banda din mijloc a soselei: liniile intrerupte
 for(let i=0;i<6;i++){const a=Math.pow(i/6,2),b=Math.pow((i+0.45)/6,2),y1=HY+(Yb-HY)*a,y2=HY+(Yb-HY)*b;
  mk('path',{d:`M${HX-2-a*10} ${y1} L${HX+2+a*10} ${y1} L${HX+2+b*10} ${y2} L${HX-2-b*10} ${y2} Z`,fill:AMB,opacity:0.9},null,G)}
 // viteza, plutind deasupra orizontului
 t(1150,150,64,'#ff3b2a','87','end',0,500);t(1150,168,12,'#ffd0a0','KM/H','end',4);
 t(40,140,22,CY,'61%','start',1,500);t(40,158,11,'#ffd0a0','HV','start',4);t(160,140,22,AMB,'+14','start',1,500);t(160,158,11,'#ffd0a0','KW','start',4);
}

// =======================================================================
// ECRAN 6 - ORBITELE: trei inele in jurul unui punct. Exterior = viteza,
// mijloc = turatia motorului, interior = bateria. Punctul din centru
// respira cu puterea: mare cand trage, mic si albastru cand incarca.
if(ECRAN==='6'){
 antet('REGEN',CY,'ORBITE');
 const cx=595,cy=262;
 function inel(rr,f,c,gros,seg){
  const n=seg;for(let i=0;i<n;i++){const a0=-90+i*360/n+1.2,a1=-90+(i+1)*360/n-1.2,on=i/n<f;
   const p=(a)=>[cx+rr*Math.cos(a*Math.PI/180),cy+rr*Math.sin(a*Math.PI/180)],[x0,y0]=p(a0),[x1,y1]=p(a1);
   mk('path',{d:`M${x0} ${y0} A${rr} ${rr} 0 0 1 ${x1} ${y1}`,fill:'none',stroke:on?c:DIM,'stroke-width':gros,opacity:on?(0.45+0.55*i/(n*f+0.001)).toFixed(2):1},null,G)}
 }
 inel(160,46/180,RED,14,60);
 inel(122,0,AMB,10,40);
 inel(88,0.63,CY,10,30);
 // punctul care respira
 mk('circle',{cx,cy,r:44,fill:CY,opacity:0.12},null,G);
 mk('circle',{cx,cy,r:26,fill:CY,opacity:0.9},null,G);
 // etichete, ca pe o harta stelara, legate cu linii fine
 function eticheta(rr,ung,x,y,c,val,nume,anc){const a=ung*Math.PI/180,px=cx+rr*Math.cos(a),py=cy+rr*Math.sin(a);
  ln(px,py,x,y-8,c,1,{opacity:0.5});mk('circle',{cx:px,cy:py,r:3,fill:c},null,G);
  t(x,y+18,34,c,val,anc,0,500);t(x,y-14,12,LAB,nume,anc,3)}
 eticheta(160,-30,880,140,RED,'46 km/h','VITEZA','start');
 eticheta(122,200,250,200,DIM,'0 rpm','MOTOR OPRIT','end');
 eticheta(88,40,860,370,CY,'63%','BATERIE','start');
 t(250,370,12,LAB,'INCARCA','end',3);t(250,402,34,CY,'-21 kW','end',0,500);
}
// =======================================================================
// ECRAN CONSOLA - pupitrul lui KITT, cu ceasuri de bare verzi-galbene-rosii,
// cifre de sapte segmente si lampi galbene de avertizare. Fiecare ceas e o
// marime pe care masina chiar o da.
if(ECRAN==='consola'){
 const VE='#2fd34a',GA='#ffd21c',RO='#ff2d1c',VEs='#0c2a12',GAs='#2e2706',ROs='#2b0c0a',LAMP='#ffd21c',LAMPs='#2a2306',ALB='#d8d8d8';
 const stins=c=>c===VE?VEs:(c===GA?GAs:ROs);
 t(40,32,17,'#ff3b2a','LEXUS NX 300h','start',4);
 t(1150,32,17,AMB,'HYBRID','end',4);
 ln(40,42,1150,42,LINE,1.5);

 // cifre de sapte segmente
 function cifra(x,y,w,h,ch,c){
